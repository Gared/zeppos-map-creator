name: Publish Docker image

on:
  release:
    types: [ published ]
  push:
    branches:
      - 'main'

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: gared/zeppos-map-creator
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Test map generation
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image="${IMAGE_TAGS%%$'\n'*}"
          test -n "$image"
          mkdir -p "$RUNNER_TEMP/zeppos-smoke"
          cp tests/fixtures/smoke-test.osm "$RUNNER_TEMP/zeppos-smoke/"
          docker run --rm \
            --volume "$RUNNER_TEMP/zeppos-smoke:/data" \
            --entrypoint osmium \
            "$image" cat /data/smoke-test.osm -o /data/smoke-test.osm.pbf
          docker run --rm \
            --volume "$RUNNER_TEMP/zeppos-smoke:/data" \
            "$image" 0 0 /data/smoke-test.osm.pbf
          output="$RUNNER_TEMP/zeppos-smoke/map0.0-0.0.zip"
          test -s "$output"
          unzip -t "$output"
          unzip -Z1 "$output" | grep -q '\.img$'

      - name: Push tested Docker image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            if [ -n "$image" ]; then
              docker push "$image"
            fi
          done <<< "$IMAGE_TAGS"
